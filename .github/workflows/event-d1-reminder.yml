name: Event D-1 reminder

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger D-1 event reminder
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 \
            -X POST \
            https://nruqzbxiioxvomjlxfon.supabase.co/functions/v1/event-d1-reminder
