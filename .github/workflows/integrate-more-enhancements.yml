name: Integrate app enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[enhancements-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement scripts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='index.html';
          let s=fs.readFileSync(p,'utf8');
          for (const file of ['more-enhancements.js','password-enhancements.js','event-enhancements.js','admin-score-enhancements.js','mobile-refresh-fix.js','admin-member-delete.js','admin-members-enhancements.js']) {
            const tag=`<script src="./${file}"></script>`;
            if(!s.includes(tag)){
              const marker='</body>';
              if(!s.includes(marker)) throw new Error('index.html: </body> not found');
              s=s.replace(marker,`${tag}\n${marker}`);
            }
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: integrate admin members controls [enhancements-integrated]'
          git push
