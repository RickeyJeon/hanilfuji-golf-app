<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d3b2e"><title>회원 계정 활성화 | HANIL-FUJI</title>
<style>
:root{--bg:#f4f7f3;--card:#fff;--text:#17221c;--muted:#6b776f;--line:#dfe7e1;--green:#0d3b2e;--green2:#1e6a4c;--green3:#dcebe2;--danger:#c4473d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:560px;margin:auto;padding:22px}.hero{padding:24px 20px;border-radius:24px;background:linear-gradient(145deg,var(--green),#164f3a);color:#fff;margin-bottom:16px}.hero h1{margin:0 0 8px}.hero p{margin:0;line-height:1.6;opacity:.85;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.inputgroup{margin-bottom:13px}.inputgroup label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 6px 2px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:14px}.btn{width:100%;padding:13px;border:0;border-radius:13px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:var(--green2);color:#fff}.secondary{display:block;text-align:center;text-decoration:none;background:var(--green3);color:var(--green2);margin-top:9px}.notice{padding:12px;border-radius:13px;font-size:13px;line-height:1.6;margin-top:13px}.info{background:#edf4ef;color:#30513f}.success{background:#e7f6ea;color:#23643a}.error{background:#fdecec;color:#9d2d2d}.small{font-size:12px;color:var(--muted);line-height:1.6}
</style><script src="./password-visibility.js"></script></head>
<body><div class="page"><section class="hero"><h1>회원 계정 활성화</h1><p>관리자 승인이 완료된 회원은 여기서 이메일과 새 비밀번호를 등록한 뒤 휴대폰 번호로 로그인할 수 있습니다.</p></section><section class="card"><div class="inputgroup"><label for="phone">가입 신청 휴대폰 번호</label><input id="phone" inputmode="tel" placeholder="01012345678"></div><div class="inputgroup"><label for="email">가입 신청 이메일</label><input id="email" type="email" placeholder="가입 신청 때 입력한 이메일"></div><div class="inputgroup"><label for="password">새 비밀번호</label><input id="password" type="password" autocomplete="new-password" placeholder="8자 이상"></div><div class="inputgroup"><label for="confirm">새 비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password"></div><div id="message" class="notice info">관리자 승인 완료 후에만 계정을 활성화할 수 있습니다.</div><button id="activate" class="btn primary">계정 활성화</button><a class="btn secondary" href="./index.html">로그인으로 돌아가기</a></section></div>
<script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const supabase=createClient("https://nruqzbxiioxvomjlxfon.supabase.co","sb_publishable_gTo4Zc7LBhFX1F0wAQyeKg_Yr6U24An");const $=id=>document.getElementById(id),msg=(kind,text)=>{$("message").className=`notice ${kind}`;$('message').textContent=text},norm=v=>(v||'').replace(/\D/g,'');$('activate').onclick=async()=>{const phone=norm($('phone').value),email=$('email').value.trim().toLowerCase(),password=$('password').value,confirm=$('confirm').value;if(phone.length<10||!email){msg('error','휴대폰 번호와 가입 이메일을 입력해 주세요.');return}if(password.length<8){msg('error','새 비밀번호는 8자 이상이어야 합니다.');return}if(password!==confirm){msg('error','새 비밀번호가 일치하지 않습니다.');return}$('activate').disabled=true;msg('info','승인 상태와 계정을 확인하는 중입니다.');const{data:valid,error:checkError}=await supabase.rpc('check_signup_activation',{phone_input:phone,email_input:email});if(checkError||!valid){msg('error','승인된 가입 신청과 일치하는 정보를 찾지 못했습니다.');$('activate').disabled=false;return}const{data,error}=await supabase.auth.signUp({email,password,options:{data:{phone,full_name:''}}});if(error){msg('error',error.message.includes('already')?'이미 활성화된 계정입니다. 로그인해 주세요.':`계정 활성화 실패: ${error.message}`);$('activate').disabled=false;return}if(data.session){msg('success','계정이 활성화되었습니다. 이제 휴대폰 번호와 새 비밀번호로 로그인하세요.')}else{msg('success','계정이 생성되었습니다. 이메일 확인이 필요한 경우 메일함에서 확인 후 로그인하세요.')}};</script></body></html>
