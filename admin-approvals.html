<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0d3b2e"/><title>가입 승인 관리 | HANIL-FUJI</title><style>:root{--bg:#f4f7f3;--card:#fff;--text:#17221c;--muted:#6b776f;--line:#dfe7e1;--green:#0d3b2e;--green2:#1e6a4c;--green3:#dcebe2;--danger:#c4473d;--shadow:0 10px 28px rgba(23,54,37,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:900px;margin:auto;padding:22px}.hero{padding:22px 20px;border-radius:24px;background:linear-gradient(145deg,var(--green),#164f3a);color:#fff;margin-bottom:16px}.hero h1{margin:0 0 7px}.hero p{margin:0;color:#ffffffd1;line-height:1.6}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inputgroup{margin-bottom:12px}.inputgroup label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:14px}.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:850;cursor:pointer}.primary{background:var(--green2);color:#fff}.secondary{background:var(--green3);color:var(--green2)}.danger{background:#f9e1e0;color:#a12626}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{margin-top:12px;padding:12px;border-radius:14px;font-size:13px;line-height:1.6}.info{background:#edf4ef;color:#30513f}.error{background:#fdecec;color:#9d2d2d}.success{background:#e7f6ea;color:#23643a}.hidden{display:none}.meta{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}</style></head><body><div class="page"><section class="hero"><h1>가입 승인 관리</h1><p>관리자 전용 화면입니다. 일반 회원은 이 페이지의 승인 데이터에 접근할 수 없습니다.</p></section><section id="loginCard" class="card"><div class="row"><div class="inputgroup"><label for="adminId">관리자 ID</label><input id="adminId" inputmode="tel" placeholder="휴대폰 번호" autocomplete="username"/></div><div class="inputgroup"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password"/></div></div><div class="actions"><button id="loginBtn" class="btn primary">관리자 로그인</button><a class="btn secondary" href="./index.html" style="text-decoration:none">메인으로 돌아가기</a></div><div id="authMessage" class="notice info">관리자 계정으로 로그인해 주세요.</div></section><section id="appCard" class="card hidden"><div class="actions" style="justify-content:space-between;align-items:center;margin-bottom:10px"><div><strong id="adminName">관리자</strong><div class="meta" id="adminMeta"></div></div><div class="actions"><button id="refreshBtn" class="btn secondary">새로고침</button><button id="logoutBtn" class="btn danger">로그아웃</button></div></div><div id="listMessage" class="notice info">목록을 불러오는 중입니다.</div><div style="overflow:auto"><table><thead><tr><th>신청자</th><th>연락처</th><th>소속</th><th>상태</th><th>처리</th></tr></thead><tbody id="requestRows"></tbody></table></div></section></div><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const supabase=createClient("https://nruqzbxiioxvomjlxfon.supabase.co","sb_publishable_gTo4Zc7LBhFX1F0wAQyeKg_Yr6U24An");const $=id=>document.getElementById(id);let currentAdmin=null;const box=(el,k,t)=>{el.className=`notice ${k}`;el.textContent=t};
async function getAdmin(){const{data:{session}}=await supabase.auth.getSession();if(!session)return null;const{data:me}=await supabase.from('club_members').select('id,full_name,phone_e164,role,status,company_name,department_name,auth_user_id').eq('auth_user_id',session.user.id).maybeSingle();if(!me||me.status!=='active'||!['primary_admin','assistant_admin'].includes(me.role))return null;return me}
async function loadRequests(){box($('listMessage'),'info','가입 신청 목록을 불러오는 중입니다.');const{data,error}=await supabase.from('signup_requests').select('id,full_name,nickname,phone_e164,company_name,department_name,position_title,status,created_at').order('created_at',{ascending:true});if(error){box($('listMessage'),'error',`처리 실패: ${error.message}`);return}$('requestRows').innerHTML=(data||[]).map(r=>`<tr><td><strong>${r.full_name||'-'}${r.nickname?` [${r.nickname}]`:''}</strong><div class="meta">${new Date(r.created_at).toLocaleString('ko-KR')}</div></td><td>${r.phone_e164||'-'}</td><td>${r.company_name||'-'}<br>${r.department_name||'-'} · ${r.position_title||'-'}</td><td>${r.status}</td><td><div class="actions"><button class="btn primary" data-approve="${r.id}" ${r.status!=='pending'?'disabled':''}>승인</button><button class="btn danger" data-reject="${r.id}" ${r.status!=='pending'?'disabled':''}>반려</button></div></td></tr>`).join('');box($('listMessage'),'success',data?.length?`총 ${data.length}건의 가입 신청이 있습니다.`:'현재 가입 신청이 없습니다.')}
async function showApp(me){currentAdmin=me;$('adminName').textContent=me.full_name;$('adminMeta').textContent=`${me.role} · ${me.company_name||''} ${me.department_name||''}`.trim();$('loginCard').classList.add('hidden');$('appCard').classList.remove('hidden');await loadRequests()}
async function requireAdmin(){const me=await getAdmin();if(!me){await supabase.auth.signOut();$('loginCard').classList.remove('hidden');$('appCard').classList.add('hidden');return false}await showApp(me);return true}
$('loginBtn').onclick=async()=>{const raw=$('adminId').value.trim(),digits=raw.replace(/\D/g,''),phone=digits.length===8?`010${digits}`:digits,password=$('password').value;box($('authMessage'),'info','로그인 중입니다.');const{data:email,error:resolveError}=await supabase.rpc('resolve_login_email',{phone_input:phone});if(resolveError||!email){box($('authMessage'),'error',`관리자 ID 확인 실패: ${resolveError?.message||'등록된 로그인 ID가 없습니다.'}`);return}const{error}=await supabase.auth.signInWithPassword({email,password});if(error){box($('authMessage'),'error',`로그인 실패: ${error.message}`);return}if(!(await requireAdmin()))box($('authMessage'),'error','관리자 권한이 없는 계정입니다.')};
$('requestRows').onclick=async e=>{const approve=e.target.closest('[data-approve]')?.dataset.approve,reject=e.target.closest('[data-reject]')?.dataset.reject;if(!approve&&!reject)return;const id=approve||reject,button=e.target.closest('button');button.disabled=true;if(reject){box($('listMessage'),'info','반려 처리 중입니다.');const{data,error}=await supabase.rpc('admin_reject_signup_request',{p_request_id:id,p_admin_member_id:currentAdmin.id});if(error||!data?.ok){box($('listMessage'),'error',`반려 처리에 실패했습니다. ${error?.message||'실제 오류 원인을 확인해 주세요.'}`);button.disabled=false;return}box($('listMessage'),'success','반려가 완료되었습니다.');await loadRequests();return}box($('listMessage'),'info','승인 처리 중입니다. 회원정보와 Auth 계정을 안전하게 연결합니다.');const{data:{session}}=await supabase.auth.getSession();if(!session){box($('listMessage'),'error','승인 처리에 실패했습니다. 관리자 세션이 없습니다.');button.disabled=false;return}try{const response=await fetch('https://nruqzbxiioxvomjlxfon.supabase.co/functions/v1/approve-signup-v3',{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,apikey:'sb_publishable_gTo4Zc7LBhFX1F0wAQyeKg_Yr6U24An','Content-Type':'application/json'},body:JSON.stringify({request_id:id})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||`HTTP ${response.status}`);box($('listMessage'),'success',result.message||'승인이 완료되었습니다. 회원정보가 등록되었습니다.');await loadRequests()}catch(err){box($('listMessage'),'error',`승인 처리에 실패했습니다. ${err?.message||'실제 오류 원인을 확인할 수 없습니다.'}`);button.disabled=false}};
$('refreshBtn').onclick=loadRequests;$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();currentAdmin=null;$('loginCard').classList.remove('hidden');$('appCard').classList.add('hidden');box($('authMessage'),'info','로그아웃되었습니다.')};await requireAdmin();
</script></body></html>
