/* v20 branding + vote UX */
.loginlogo .crest{width:106px;height:106px;border-radius:50%;overflow:hidden;background:var(--card);box-shadow:0 8px 24px rgba(0,55,35,.10);border:0}
.loginlogo .crest img{width:128%;height:auto;max-width:none;max-height:none;object-fit:contain;display:block}
.brandmark{overflow:hidden;background:var(--card);border:0;box-shadow:none;padding:0}
.brandmark img{width:132%;height:auto;max-width:none;display:block;object-fit:contain}
.vote-summary{margin-top:12px;padding:12px;border-radius:14px;background:var(--green3);border:1px solid var(--line)}
.vote-summary-line{font-size:12px;color:var(--muted);margin-bottom:9px}
.vote-summary-line b{color:var(--green2);font-size:13px}
.vote-submit{margin-top:10px}
.vote-submit[disabled]{opacity:.45;cursor:not-allowed}
.home-count-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}
.home-count-chip{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 9px;text-align:left;cursor:pointer;color:var(--text)}
.home-count-chip .label{font-size:10px;color:var(--muted)}
.home-count-chip .value{font-size:17px;font-weight:900;color:var(--green2);margin-top:2px}
.home-count-chip.active{background:var(--green3);border-color:#b9d9c9}
.inline-member-panel{margin-top:8px;padding:10px;border-radius:13px;background:var(--green3);border:1px solid var(--line)}
.inline-member-panel .inline-title{font-size:11px;font-weight:900;color:var(--green2);margin-bottom:7px}
.inline-member-row{padding:8px 0;border-bottom:1px solid rgba(0,0,0,.07)}
.inline-member-row:last-child{border-bottom:0}
.inline-member-row strong{font-size:12px;display:block}
.inline-member-row small{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.inline-member-empty{font-size:12px;color:var(--muted);padding:6px 0}

  const a=list.slice(),n=a.length;if(!n)return [];

async function submitEventComposer(){

  }
  if(type==='SCHEDULE'){
    if(!isAdmin())return;

    const deadline=composeDeadline.value||deadlineForDate(date),startIso=new Date(`${date}T${time}:00+09:00`).toISOString(),deadlineIso=new Date(`${deadline}:00+09:00`).toISOString();
    const {data:eventRow,error}=await hfSupabase.from('club_events').insert({title,event_type:String(composeEventType.value||'SCREEN').toLowerCase(),event_status:'published',venue_name:location,course_name:courseName||null,starts_at:startIso,attendance_deadline:deadlineIso,published:true,created_by_member_id:currentUser.dbId}).select('id,title,starts_at').single();
    if(error){alert(error.message);return}
    try{
      if(typeof window.hfSendPush==='function')await window.hfSendPush({notificationType:'event',sourceId:eventRow?.id,title:'새 일정: '+title,body:date+' '+time+' · '+location});
    }catch(pushError){console.warn('[APP] event push failed',pushError)}
    await loadSupabaseClubEvents();closeModal();eventMode='SCHEDULE';render('event');return;
  }
  const id=composeGroupEvent.value;closeModal();groupEventId=id;eventMode='GROUP';const e=getClubEvents().find(x=>x.id===id);if(e&&!getEventGroups()[id])buildGroupsForEvent(e,true);render('event');
}

function seedV19BackupIfNeeded(){
  const marker='hf_embedded_data_version';
  const version='v21-2026-08-16-colors';
  if(localStorage.getItem(marker)===version)return;
  // v20은 현재 브라우저에서 이미 수정한 운영 데이터를 덮어쓰지 않습니다.
  // 처음 여는 기기에는 내장 백업을 채우고, 기존 기기에는 없는 항목만 보충합니다.
  Object.entries(EMBEDDED_V18_BACKUP).forEach(([k,v])=>{if(localStorage.getItem(k)===null)localStorage.setItem(k,String(v))});
  localStorage.setItem(marker,version);
}

function getScoreEvents(){try{return JSON.parse(localStorage.getItem('hf_score_events')||'{}')}catch(e){return {}}}
function saveScoreEvents(v){localStorage.setItem('hf_score_events',JSON.stringify(v))}
function getFeeStatuses(){
  try{return JSON.parse(localStorage.getItem('hf_fee_status_2026')||'{}')}catch(e){return {}}
}
function saveFeeStatuses(v){localStorage.setItem('hf_fee_status_2026',JSON.stringify(v))}
function feeStatusCode(memberId){return getFeeStatuses()[memberId]||'UNPAID'}
function feeStatusLabel(code){return ({UNPAID:'미납',HALF:'6개월납',PAID:'완납'})[code]||'미납'}
function myFeeLabel(){return feeStatusLabel(feeStatusCode(currentUser.id))}
function openEventFromHome(){if(eventMode!=='NOTICE')eventMode='SCHEDULE';go('event',document.querySelector('[data-page=event]'))}
function openRankingFromHome(){rankingMode='ANNUAL';go('ranking',document.querySelector('[data-page=ranking]'))}
function currentSeasonYear(){return new Date().getFullYear()}
function availableSeasonYears(){
  const years=new Set([currentSeasonYear()]);
  Object.values(getScoreEvents()).forEach(ev=>{if(ev&&ev.year)years.add(+ev.year)});
  getClubEvents().forEach(ev=>{const y=+(String(ev.date||'').slice(0,4));if(y)years.add(y)});
  return [...years].filter(Boolean).sort((a,b)=>b-a);
}
function seasonStatus(year){return year<currentSeasonYear()?'FINAL':'IN PROGRESS'}
function annualPointsFor(m,year=rankingYear){let total=0;Object.values(getScoreEvents()).forEach(ev=>{if(ev.status==='CONFIRMED'&&+ev.year===+year){let r=(ev.results||[]).find(x=>x.memberId===m.id);if(r)total+=r.total}});return total}
function annualPointRows(year=rankingYear){return members.filter(m=>m.status!=='INACTIVE').map(m=>({m,points:annualPointsFor(m,year)})).sort((a,b)=>b.points-a.points||a.m.name.localeCompare(b.m.name,'ko'))}
function monthlyPointsFor(m,month,year=rankingYear){let total=0,played=0;Object.values(getScoreEvents()).forEach(ev=>{if(ev.status==='CONFIRMED'&&+ev.year===+year&&+ev.month===+month){let r=(ev.results||[]).find(x=>x.memberId===m.id);if(r){total+=r.total;played++}}});return {total,played}}
function displayEventRank(ev,r){const count=ev.results.filter(x=>x.rank===r.rank).length;return (count>1?'T':'')+r.rank}
function detailedMonthlyEvent(ev){
  const sorted=ev.results.slice().sort((a,b)=>a.rank-b.rank||a.adjusted-b.adjusted||a.memberId-b.memberId);
  return `<div class="card monthly-result-card"><div class="monthly-result-head"><div><strong>${ev.month}월 ${ev.type==='FIELD'?'필드':'스크린'} 결과</strong>${ev.courseName?`<div class="course-line"><b>맵:</b> ${ev.courseName}</div>`:''}</div><span>확정 ${sorted.length}명</span></div><div class="monthly-result-row header"><div>순위</div><div>회원</div><div class="num">스코어</div><div class="num">핸디</div><div class="num">최종</div><div class="pts">POINT</div></div>${sorted.map(r=>{const m=members.find(x=>x.id===r.memberId);return `<div class="monthly-result-row"><div class="rnk">${displayEventRank(ev,r)}</div><div class="nm">${m?nameOf(m):'회원'}<small>${m?.dept||''}</small></div><div class="num">${r.grossScore??r.score}</div><div class="num">${r.handicap>0?'+':''}${r.handicap}</div><div class="num"><b>${r.adjusted}</b></div><div class="pts">${r.total}P</div></div>`}).join('')}</div>`;
}
function averageRankingRows(type=averageType){
  const rows=members.filter(m=>m.status!=='INACTIVE').map(m=>{
    const a=memberRecentAverage(m.id,type);return a?{m,avg:a.avg,games:a.games}:null;

function latestScore(){

function confirmedScoreEvents(type=recordType){
  const all=Object.values(getScoreEvents()).filter(e=>e&&e.status==='CONFIRMED'&&e.type===type);
  return all.sort((a,b)=>{
    const da=a.eventDate||`${a.year||2026}-${String(a.month||1).padStart(2,'0')}-01`;
    const db=b.eventDate||`${b.year||2026}-${String(b.month||1).padStart(2,'0')}-01`;
    return new Date(da)-new Date(db) || new Date(a.confirmedAt||0)-new Date(b.confirmedAt||0);
  });
}
function scoreEventMeta(ev){
  if(ev.eventDate||ev.location||ev.courseName)return {date:ev.eventDate||`${ev.year}.${String(ev.month).padStart(2,'0')}`,location:ev.location||'',courseName:ev.courseName||''};

function memberRecord(memberId,type=recordType){

  }).filter(Boolean);

function exportAppBackup(){

  keys.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)data.data[k]=v});

function importAppBackup(){
  if(!currentUser || currentUser.role==='USER'){alert('관리자만 사용할 수 있습니다.');return}
  const input=document.getElementById('backupFileInput');
  const file=input&&input.files&&input.files[0];
  if(!file){alert('복원할 JSON 백업 파일을 선택해 주세요.');return}
  if(!confirm('현재 저장된 데이터를 백업 파일 내용으로 교체하시겠습니까?'))return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const backup=JSON.parse(reader.result);
      if(!backup || !backup.data || typeof backup.data!=='object')throw new Error('invalid backup');
      const allowed=['hf_members','hf_club_events','hf_notices','hf_event_groups','hf_groups','hf_score_events','hf_fee_status_2026'];
      allowed.forEach(k=>{if(Object.prototype.hasOwnProperty.call(backup.data,k))localStorage.setItem(k,String(backup.data[k]))});
      alert('데이터 복원이 완료되었습니다. 화면을 새로 불러옵니다.');
      location.reload();
    }catch(e){alert('올바른 HANIL-FUJI 백업 파일이 아닙니다.');}
  };
  reader.readAsText(file,'utf-8');
}

function normalizeExcelMemberName(v){return String(v??'').trim().replace(/^['"]|['"]$/g,'').replace(/\s*\[[^\]]*\]\s*$/,'').replace(/\s+/g,' ')}
function findMemberFromExcelName(v){
  const raw=String(v??'').trim(),clean=normalizeExcelMemberName(raw).toLowerCase();if(!clean)return null;
  return members.find(m=>m.name.toLowerCase()===clean)||members.find(m=>(m.nick||'').toLowerCase()===clean)||members.find(m=>nameOf(m).toLowerCase()===raw.toLowerCase())||null;
}
function parseExcelScoreRows(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').map(x=>x.trimEnd()).filter(x=>x.trim());
  const out=[],errors=[];const seen=new Set();
  lines.forEach((line,index)=>{
    let cells=line.includes('	')?line.split('	'):line.split(/\s{2,}|,/);
    cells=cells.map(x=>String(x).trim());
    if(!cells.length)return;
    // 전체 행을 복사해 앞에 빈 열/순번이 있어도 회원 이름이 있는 열을 찾는다.
    let nameIdx=cells.findIndex(c=>!!findMemberFromExcelName(c));
    if(nameIdx<0){
      if(index===0 && cells.join(' ').match(/이름|스트로크|스코어|핸디|최종/))return;
      errors.push(`${index+1}행: 회원 이름을 찾을 수 없음 (${cells[0]||'빈 값'})`);return;
    }
    const m=findMemberFromExcelName(cells[nameIdx]);
    if(seen.has(m.id)){errors.push(`${index+1}행: ${m.name} 중복`);return}seen.add(m.id);
    const scoreVal=cells[nameIdx+1],handicapVal=cells[nameIdx+2],finalVal=cells[nameIdx+3];
    // Excel C열 '스트로크'는 항상 PAR 72 대비 상대값입니다. 50도 +50으로 해석합니다.
    const stroke=Number(String(scoreVal??'').replace(/^\+/,'')),handicap=Number(handicapVal);
    if(!Number.isFinite(stroke)||!Number.isFinite(handicap)){errors.push(`${index+1}행 ${m.name}: 스트로크/핸디 확인 필요`);return}
    const gross=72+stroke,computed=gross+handicap;
    let suppliedFinal=null,finalOk=true;
    if(finalVal!==undefined&&finalVal!==''){
      suppliedFinal=Number(finalVal);finalOk=Number.isFinite(suppliedFinal)&&suppliedFinal===computed;
      if(!finalOk)errors.push(`${index+1}행 ${m.name}: 최종타수 ${finalVal} ≠ 자동계산 ${computed}`);
    }
    out.push({memberId:m.id,name:m.name,score:String(scoreVal),stroke,gross,handicap:String(handicapVal),computedFinal:computed,suppliedFinal,finalOk});
  });
  return {rows:out,errors};
}

function parseGolfScoreInput(value){
  const t=String(value??'').trim();if(!t)return null;const n=Number(t);if(!Number.isFinite(n))return null;
  // 명시적인 +기호는 크기와 관계없이 PAR 대비 상대 스코어입니다. (+50 => 122타)
  if(t.startsWith('+') && n>=0 && n<=100)return {input:t,toPar:n,gross:72+n};
  // -30~30은 PAR 72 기준 상대 스코어. 4와 +4는 모두 76타입니다.
  if(n>=-30&&n<=30)return {input:t,toPar:n,gross:72+n};
  // 기호 없는 큰 수는 실제 총타수로 처리합니다.
  if(n>=50&&n<=180)return {input:t,toPar:n-72,gross:n};
  return null;
}
